<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Sing-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold">Bienvenido</h1>
        <p class="text-muted">Inicia sesión con tu cuenta de Google o con tus credenciales</p>
      </div>
      <div class="row justify-content-center g-4">
        <div class="col-12 col-md-5">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column align-items-center text-center p-4">
              <h2 class="h4 mb-3">Google Sign-in</h2>
              <hr class="w-100" />
              <div id="g_id_onload" data-client_id="326937397123-adn6qg9olpl9k79lc5da019curt32pto.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
              <div class="g_id_signin mb-3" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
              <button id="google_signout" class="btn btn-outline-secondary mt-auto">Sign out</button>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-5">
          <form id="formLogin" class="card h-100 shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="h4 mb-3 text-center">Login manual</h2>
              <hr />
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="text" name="correo" class="form-control" placeholder="Correo" />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" />
              </div>
              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="./js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
